; Node ghe - nhieu env, chon env khi build/nap:
;   pio run -e hello   -t upload   -> in MAC/flash, chay thu LED
;   pio run -e sensors -t upload   -> kiem tra radar + ToF
;   pio run -e node1   -t upload   -> firmware day du cho Seat-01
;   pio run -e node2   -t upload   -> firmware day du cho Seat-02
;   pio run -e collect -t upload   -> xuat CSV cho Edge Impulse (buoc A7)

[platformio]
default_envs = node1

[env]
platform = espressif32
board = yolo_uno
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -I ../common
lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.3
  iavorvel/MyLD2410
  adafruit/Adafruit_VL53L0X

[env:hello]
build_flags = ${env.build_flags} -D APP_MODE_HELLO

[env:sensors]
build_flags = ${env.build_flags} -D APP_MODE_SENSORS

[env:collect]
build_flags = ${env.build_flags} -D APP_MODE_COLLECT

[env:node1]
build_flags = ${env.build_flags} -D SEAT_ID=1

[env:node2]
build_flags = ${env.build_flags} -D SEAT_ID=2
