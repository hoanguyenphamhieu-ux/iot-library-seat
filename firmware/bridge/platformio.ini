; Node bridge:
;   pio run -e hello  -t upload   -> chi in MAC cua bridge
;   pio run -e bridge -t upload   -> firmware bridge day du

[platformio]
default_envs = bridge

[env]
platform = espressif32
board = yolo_uno
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -I ../common
lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.3

[env:hello]
build_flags = ${env.build_flags} -D APP_MODE_HELLO

[env:bridge]
